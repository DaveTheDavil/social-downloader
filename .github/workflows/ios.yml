# Budowa niepodpisanej .ipa na macOS runnerze (GitHub) — metoda „iOS bez Maca".
# Artefakt: social-downloader-ipa → pobierz z Actions → Sideloadly na Windows
# Trigger-test 2026-10-24: pierwszy push do pustego repo nie odpala workflow
# (quirk GitHuba); ten komentarz to realna zmiana w pliku z listy paths — pushe match.
# (+ iTunes/iCloud od Apple) → instalacja przez USB z darmowym Apple ID.
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
        working-directory: ios

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project SocialDownloader.xcodeproj \
            -scheme SocialDownloader \
            -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build-full.log
          st=$?
          if [ $st -ne 0 ]; then
            echo "::error::xcodebuild failed (exit $st) — error lines:"
            grep -E "error:" build-full.log | grep -v "\^?[0-9]+ warning" | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "error:" -c build-full.log >/dev/null || echo "::error::brak linii 'error:' w logu — patrz pełny log"
            exit $st
          fi
        working-directory: ios

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SocialDownloader.app Payload/
          zip -qry SocialDownloader.ipa Payload
        working-directory: ios

      - uses: actions/upload-artifact@v4
        with:
          name: social-downloader-ipa
          path: ios/SocialDownloader.ipa

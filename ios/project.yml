# XcodeGen — projekt generowany NA RUNNERZE (brew install xcodegen && xcodegen generate).
# .xcodeproj NIE jest commitowany. Target: jedna apka SwiftUI (iOS 16+),
# Info.plist generowane tu (NSAllowsArbitraryLoads = HTTP LAN!, Documents w Pliki).
name: SocialDownloader
options:
  bundleIdPrefix: pl.thedavil
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  SocialDownloader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.thedavil.SocialDownloader
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        # budowa niepodpisanej .ipa na CI: xcodebuild CODE_SIGNING_ALLOWED=NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SocialDownloader
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # HTTP do silnika w LAN (bez HTTPS!)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Documents widoczne w aplikacji „Pliki" (UIFileSharingEnabled)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    # brak entitlements (darmowy Apple ID + Sideloadly — nic ekstra nie trzeba)

schemes:
  SocialDownloader:
    build:
      targets:
        SocialDownloader: all
    run:
      config: Debug
    archive:
      config: Release
